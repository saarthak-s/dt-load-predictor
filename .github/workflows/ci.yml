name: CI Pipeline - API Tests

# 1. Trigger the workflow on any push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-api:
    # 2. Specify the operating system for the GitHub Actions runner
    runs-on: ubuntu-latest

    steps:
      # 3. Pull your repository code onto the runner server
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Set up the exact Python version required by the project
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 5. Install uv so dependency management and test execution use the uv-native workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      # 6. Install the project and dev dependencies using uv's project-aware dependency management.
      - name: Install Dependencies
        run: |
          uv sync --extra dev

      # 7. Run the pytest suite in the uv-managed environment.
      - name: Run Unit Tests
        run: |
          uv run pytest test_main.py -v